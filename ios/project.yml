name: Unearth
options:
  bundleIdPrefix: com.unearth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Unearth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Unearth
        excludes:
          - "**/.DS_Store"
          - Resources/Fonts
          - Assets.xcassets
    resources:
      - path: Unearth/Resources/Fonts
      - path: Unearth/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanbantu.unearth
        PRODUCT_NAME: Unearth
        INFOPLIST_FILE: Unearth/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unearth/Unearth.entitlements
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Unearth/Unearth.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    systemCapabilities:
      com.apple.SignInWithApple: true
schemes:
  Unearth:
    build:
      targets:
        Unearth: all
    run:
      config: Debug
    archive:
      config: Release
